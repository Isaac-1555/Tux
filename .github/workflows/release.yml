name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Tux ${{ github.ref_name }}"
          releaseBody: |
            Tux ${{ github.ref_name }} — multi-session terminal workspace.

            ## Downloads
            - **macOS** (universal, Intel + Apple Silicon): `.dmg`
            - **Windows**: `.msi` or `-setup.exe`
            - **Linux**: `.deb`, `.rpm`, or `.AppImage`

            ## Unsigned builds
            These builds are not code-signed.

            - **macOS:** first launch — right-click the app → **Open** → **Open**.
            - **Windows:** SmartScreen may warn — **More info** → **Run anyway**.
            - **Linux:** mark the AppImage executable (`chmod +x`) before running.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
